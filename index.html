<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Room Planner</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;

    background: #f4f6f8;
    color: #263238;
}


/* =========================
   ヘッダー
========================= */

header {

    height: 64px;

    background: white;

    border-bottom: 1px solid #ddd;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 20px;

    position: sticky;

    top: 0;

    z-index: 100;

}

.logo {

    font-size: 20px;

    font-weight: 700;

}

.header-buttons {

    display: flex;

    gap: 8px;

}

button {

    border: none;

    border-radius: 8px;

    padding: 9px 14px;

    cursor: pointer;

    background: #e9eef2;

    font-size: 14px;

}

button:hover {

    opacity: .8;

}

.primary {

    background: #455a64;

    color: white;

}


/* =========================
   メイン
========================= */

.main {

    display: grid;

    grid-template-columns: 270px 1fr 300px;

    height: calc(100vh - 64px);

}


/* =========================
   左サイドバー
========================= */

.sidebar {

    background: white;

    border-right: 1px solid #ddd;

    padding: 18px;

    overflow-y: auto;

}

.section {

    margin-bottom: 25px;

}

.section-title {

    font-size: 14px;

    font-weight: bold;

    margin-bottom: 12px;

}


/* 部屋設定 */

.room-setting {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 8px;

}

label {

    font-size: 12px;

    color: #69757b;

    display: block;

    margin-bottom: 5px;

}

input {

    width: 100%;

    padding: 8px;

    border: 1px solid #d4dadd;

    border-radius: 7px;

}


/* 家具 */

.furniture-buttons {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 7px;

}

.furniture-buttons button {

    padding: 12px 5px;

}


/* =========================
   中央
========================= */

.workspace {

    overflow: auto;

    padding: 40px;

    display: flex;

    align-items: center;

    justify-content: center;

}


/* 部屋 */

.room-wrapper {

    position: relative;

}

.room {

    position: relative;

    background-color: #fafafa;

    background-image:

        linear-gradient(
            #dfe4e7 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            #dfe4e7 1px,
            transparent 1px
        );

    border: 4px solid #455a64;

    box-shadow:
        0 10px 30px rgba(0,0,0,.08);

}


/* =========================
   家具
========================= */

.furniture {

    position: absolute;

    display: flex;

    align-items: center;

    justify-content: center;

    border: 2px solid #546e7a;

    background: #cfd8dc;

    border-radius: 7px;

    cursor: grab;

    user-select: none;

    font-size: 13px;

    text-align: center;

    transform-origin: center;

}

.furniture:active {

    cursor: grabbing;

}

.furniture.selected {

    border: 2px solid #1976d2;

    box-shadow:
        0 0 0 3px rgba(25,118,210,.15);

}

.bed {

    background: #d7ccc8;

}

.desk {

    background: #bcaaa4;

}

.chair {

    background: #b0bec5;

}

.shelf {

    background: #c5cae9;

}

.sofa {

    background: #b2dfdb;

}

.table {

    background: #ffe0b2;

}

.box {

    background: #dcedc8;

}


/* =========================
   右側 写真
========================= */

.photos {

    background: white;

    border-left: 1px solid #ddd;

    padding: 18px;

    overflow-y: auto;

}

.photo-upload {

    border: 2px dashed #c5cdd1;

    border-radius: 10px;

    padding: 20px;

    text-align: center;

    cursor: pointer;

    margin-bottom: 15px;

}

.photo-upload:hover {

    background: #f7f9fa;

}

.photo-upload input {

    display: none;

}

.photo-list {

    display: flex;

    flex-direction: column;

    gap: 14px;

}

.photo-card {

    border: 1px solid #dfe4e7;

    border-radius: 10px;

    overflow: hidden;

    background: #fafafa;

}

.photo-card img {

    width: 100%;

    display: block;

    max-height: 180px;

    object-fit: cover;

}

.photo-info {

    padding: 10px;

}

.photo-name {

    font-weight: bold;

    font-size: 13px;

    margin-bottom: 7px;

}

.photo-angle {

    width: 100%;

    padding: 7px;

    border: 1px solid #ddd;

    border-radius: 6px;

    background: white;

}


/* =========================
   家具編集
========================= */

.selected-panel {

    display: none;

}

.selected-panel.active {

    display: block;

}

.property {

    margin-bottom: 10px;

}

.delete-button {

    width: 100%;

    background: #f3dddd;

    color: #a33;

}


/* =========================
   部屋情報
========================= */

.room-info {

    position: absolute;

    bottom: -30px;

    left: 0;

    font-size: 12px;

    color: #68747b;

}


/* =========================
   空状態
========================= */

.empty-message {

    position: absolute;

    top: 50%;

    left: 50%;

    transform: translate(-50%,-50%);

    color: #9aa4aa;

    pointer-events: none;

    text-align: center;

}


/* =========================
   スマホ
========================= */

@media(max-width:900px) {

    .main {

        grid-template-columns: 230px 1fr;

    }

    .photos {

        display: none;

    }

}

@media(max-width:650px) {

    .main {

        display: flex;

        flex-direction: column;

        height: auto;

    }

    .sidebar {

        border-right: none;

        border-bottom: 1px solid #ddd;

    }

    .workspace {

        min-height: 600px;

        padding: 30px;

    }

}

</style>

</head>


<body>


<header>

    <div class="logo">
        🏠 Room Planner
    </div>

    <div class="header-buttons">

        <button onclick="saveLayout()">
            保存
        </button>

        <button onclick="loadLayout()">
            読み込み
        </button>

        <button onclick="clearLayout()">
            全消去
        </button>

    </div>

</header>


<div class="main">


<!-- =========================
     左
========================= -->

<aside class="sidebar">


<div class="section">

    <div class="section-title">
        部屋のサイズ
    </div>

    <div class="room-setting">

        <div>

            <label>
                横幅（cm）
            </label>

            <input
                id="roomWidth"
                type="number"
                value="360"
                onchange="updateRoom()"
            >

        </div>


        <div>

            <label>
                奥行き（cm）
            </label>

            <input
                id="roomDepth"
                type="number"
                value="300"
                onchange="updateRoom()"
            >

        </div>

    </div>

</div>



<div class="section">

    <div class="section-title">
        家具を追加
    </div>


    <div class="furniture-buttons">

        <button onclick="addFurniture('bed')">
            🛏️ ベッド
        </button>

        <button onclick="addFurniture('desk')">
            🖥️ 机
        </button>

        <button onclick="addFurniture('chair')">
            🪑 椅子
        </button>

        <button onclick="addFurniture('shelf')">
            📚 本棚
        </button>

        <button onclick="addFurniture('sofa')">
            🛋️ ソファ
        </button>

        <button onclick="addFurniture('table')">
            🟫 テーブル
        </button>

        <button onclick="addFurniture('box')">
            📦 その他
        </button>

    </div>

</div>



<div
    id="selectedPanel"
    class="section selected-panel"
>


    <div class="section-title">
        選択中の家具
    </div>


    <div class="property">

        <label>
            名前
        </label>

        <input
            id="furnitureName"
            onchange="changeFurnitureName()"
        >

    </div>


    <div class="property">

        <label>
            幅（cm）
        </label>

        <input
            id="furnitureWidth"
            type="number"
            onchange="changeFurnitureSize()"
        >

    </div>


    <div class="property">

        <label>
            奥行き（cm）
        </label>

        <input

            type="number"

        >

    </div>


    <div class="property">

        <button
            style="width:100%"
            onclick="rotateFurniture()"
        >
            🔄 90°回転
        </button>

    </div>

    >

    </button>

</div>


</aside>



<!-- =========================
     中央
========================= -->

<main class="workspace">


<div class="room-wrapper">

    <div
        id="room"
        class="room"
    >

        <div
            id="emptyMessage"
            class="empty-message"
        >

            家具を追加してください

        </div>

    </div>


    <div
        id="roomInfo"
        class="room-info"
    >
        360cm × 300cm
    </div>

</div>


</main>



<!-- =========================
     右
========================= -->

<aside class="photos">


<div class="section-title">
    📷 部屋の写真
</div>


<label class="photo-upload">

    <input
        id="photoInput"
        type="file"
        accept="image/*"
        multiple
        onchange="addPhotos(event)"
    >

    <div style="font-size:30px;">
        📷
    </div>

    <div>
        写真を追加
    </div>

    <small>
        複数方向から撮影した写真を登録
    </small>

</label>


<div
    id="photoList"
    class="photo-list"
></div>


</aside>


</div>



<script>


/* =========================
   データ
========================= */

let furnitureList = [];

let furnitureId = 0;

let selectedFurniture = null;

let photos = [];

let dragging = false;

let dragOffsetX = 0;

let dragOffsetY = 0;

const SCALE = 2;



/* =========================
   家具
========================= */

const furnitureTypes = {

    bed: {
        name:"ベッド",
        width:100,
        height:200
    },

    desk: {
        name:"机",
        width:120,
        height:60
    },

    chair: {
        name:"椅子",
        width:50,
        height:50
    },

    shelf: {
        name:"本棚",
        width:80,
        height:35
    },

    sofa: {
        name:"ソファ",
        width:180,
        height:80
    },

    table: {
        name:"テーブル",
        width:120,
        height:80
    },

    box: {
        name:"その他",
        width:60,
        height:60
    }

};



/* =========================
   部屋
========================= */

function updateRoom() {

    const width =
        Number(
            document.getElementById("roomWidth").value
        );

    const depth =
        Number(
            document.getElementById("roomDepth").value
        );


    const room =
        document.getElementById("room");


    room.style.width =
        width * SCALE + "px";


    room.style.height =
        depth * SCALE + "px";


    document.getElementById(
        "roomInfo"
    ).textContent =
        `${width}cm × ${depth}cm`;


    renderFurniture();

}



/* =========================
   家具追加
========================= */

function addFurniture(type) {

    const setting =
        furnitureTypes[type];


    const roomWidth =
        Number(
            document.getElementById(
                "roomWidth"
            ).value
        );


    const roomDepth =
        Number(
            document.getElementById(
                "roomDepth"
            ).value
        );


    const furniture = {

        id:furnitureId++,

        type:type,

        name:setting.name,

        width:setting.width,

        height:setting.height,

        /*
            部屋の中央付近
        */

        x:Math.max(
            10,
            (roomWidth - setting.width) / 2
        ),

        y:Math.max(
            10,
            (roomDepth - setting.height) / 2
        ),

        rotation:0

    };


    furnitureList.push(
        furniture
    );


    selectFurniture(
        furniture
    );


    renderFurniture();

}



/* =========================
   家具描画
========================= */

function renderFurniture() {

    const room =
        document.getElementById(
            "room"
        );


    room
        .querySelectorAll(".furniture")
        .forEach(
            element =>
                element.remove()
        );


    furnitureList.forEach(
        furniture => {


        const element =
            document.createElement(
                "div"
            );


        element.className =
            `furniture ${furniture.type}`;


        if (
            selectedFurniture &&
            selectedFurniture.id ===
            furniture.id
        ) {

            element.classList.add(
                "selected"
            );

        }


        element.dataset.id =
            furniture.id;


        element.textContent =
            furniture.name;


        element.style.width =
            furniture.width *
            SCALE + "px";


        element.style.height =
            furniture.height *
            SCALE + "px";


        element.style.left =
            furniture.x *
            SCALE + "px";


        element.style.top =
            furniture.y *
            SCALE + "px";


        element.style.transform =
            `rotate(${furniture.rotation}deg)`;


        element.addEventListener(
            "mousedown",
            startDrag
        );


        element.addEventListener(
            "touchstart",
            startTouchDrag,
            {passive:false}
        );


        room.appendChild(
            element
        );

    });


    updateEmptyMessage();

}



/* =========================
   空メッセージ
========================= */

function updateEmptyMessage() {

    const message =
        document.getElementById(
            "emptyMessage"
        );


    message.style.display =
        furnitureList.length === 0
        ? "block"
        : "none";

}



/* =========================
   選択
========================= */

function selectFurniture(
    furniture
) {

    selectedFurniture =
        furniture;


    document
        .getElementById(
            "selectedPanel"
        )
        .classList.add(
            "active"
        );


    document.getElementById(
        "furnitureName"
    ).value =
        furniture.name;


    document.getElementById(
        "furnitureWidth"
    ).value =
        furniture.width;


    document.getElementById(
        "furnitureHeight"
    ).value =
        furniture.height;

}



/* =========================
   ドラッグ
========================= */

function startDrag(event) {

    event.preventDefault();


    const element =
        event.currentTarget;


    const id =
        Number(
            element.dataset.id
        );


    const furniture =
        furnitureList.find(
            item =>
                item.id === id
        );


    if (!furniture)
        return;


    selectFurniture(
        furniture
    );


    const room =
        document
            .getElementById("room")
            .getBoundingClientRect();


    dragOffsetX =
        event.clientX -
        (
            room.left +
            furniture.x *
            SCALE
        );


    dragOffsetY =
        event.clientY -
        (
            room.top +
            furniture.y *
            SCALE
        );


    dragging = true;


    document.addEventListener(
        "mousemove",
        dragFurniture
    );


    document.addEventListener(
        "mouseup",
        stopDrag
    );

}



function dragFurniture(event) {

    if (
        !dragging ||
        !selectedFurniture
    )
        return;


    const room =
        document
            .getElementById("room")
            .getBoundingClientRect();


    const roomWidth =
        Number(
            document.getElementById(
                "roomWidth"
            ).value
        );


    const roomDepth =
        Number(
            document.getElementById(
                "roomDepth"
            ).value
        );


    let x =
        (
            event.clientX -
            room.left -
            dragOffsetX
        ) / SCALE;


    let y =
        (
            event.clientY -
            room.top -
            dragOffsetY
        ) / SCALE;


    const maxX =
        roomWidth -
        selectedFurniture.width;


    const maxY =
        roomDepth -
        selectedFurniture.height;


    x =
        Math.max(
            0,
            Math.min(x,maxX)
        );


    y =
        Math.max(
            0,
            Math.min(y,maxY)
        );


    selectedFurniture.x =
        x;


    selectedFurniture.y =
        y;


    const element =
        document.querySelector(
            `.furniture[data-id="${selectedFurniture.id}"]`
        );


    if(element){

        element.style.left =
            x * SCALE + "px";

        element.style.top =
            y * SCALE + "px";

    }

}



function stopDrag() {

    dragging = false;


    document.removeEventListener(
        "mousemove",
        dragFurniture
    );


    document.removeEventListener(
        "mouseup",
        stopDrag
    );

}



/* =========================
   タッチ
========================= */

function startTouchDrag(event) {

    event.preventDefault();


    const touch =
        event.touches[0];


    const element =
        event.currentTarget;


    const id =
        Number(
            element.dataset.id
        );


    const furniture =
        furnitureList.find(
            item =>
                item.id === id
        );


    if (!furniture)
        return;


    selectFurniture(
        furniture
    );


    const room =
        document
            .getElementById("room")
            .getBoundingClientRect();


    dragOffsetX =
        touch.clientX -
        (
            room.left +
            furniture.x *
            SCALE
        );


    dragOffsetY =
        touch.clientY -
        (
            room.top +
            furniture.y *
            SCALE
        );


    dragging = true;


    document.addEventListener(
        "touchmove",
        touchMove,
        {passive:false}
    );


    document.addEventListener(
        "touchend",
        touchEnd
    );

}



function touchMove(event) {

    if(
        !dragging ||
        !selectedFurniture
    )
        return;


    event.preventDefault();


    const touch =
        event.touches[0];


    const room =
        document
            .getElementById("room")
            .getBoundingClientRect();


    const roomWidth =
        Number(
            document.getElementById(
                "roomWidth"
            ).value
        );


    const roomDepth =
        Number(
            document.getElementById(
                "roomDepth"
            ).value
        );


    let x =
        (
            touch.clientX -
            room.left -
            dragOffsetX
        ) / SCALE;


    let y =
        (
            touch.clientY -
            room.top -
            dragOffsetY
        ) / SCALE;


    x =
        Math.max(
            0,
            Math.min(
                x,
                roomWidth -
                selectedFurniture.width
            )
        );


    y =
        Math.max(
            0,
            Math.min(
                y,
                roomDepth -
                selectedFurniture.height
            )
        );


    selectedFurniture.x =
        x;


    selectedFurniture.y =
        y;


    const element =
        document.querySelector(
            `.furniture[data-id="${selectedFurniture.id}"]`
        );


    if(element){

        element.style.left =
            x * SCALE + "px";

        element.style.top =
            y * SCALE + "px";

    }

}



function touchEnd() {

    dragging = false;


    document.removeEventListener(
        "touchmove",
        touchMove
    );


    document.removeEventListener(
        "touchend",
        touchEnd
    );

}



/* =========================
   家具編集
========================= */

function changeFurnitureName() {

    if(!selectedFurniture)
        return;


    selectedFurniture.name =
        document.getElementById(
            "furnitureName"
        ).value;


    renderFurniture();

}



function changeFurnitureSize() {

    if(!selectedFurniture)
        return;


    selectedFurniture.width =
        Number(
            document.getElementById(
                "furnitureWidth"
            ).value
        );


    selectedFurniture.height =
        Number(
            document.getElementById(
                "furnitureHeight"
            ).value
        );


    renderFurniture();

}



function rotateFurniture() {

    if(!selectedFurniture)
        return;


    selectedFurniture.rotation +=
        90;


    renderFurniture();

}



function deleteFurniture() {

    if(!selectedFurniture)
        return;


    furnitureList =
        furnitureList.filter(
            item =>
                item.id !==
                selectedFurniture.id
        );


    selectedFurniture =
        null;


    document
        .getElementById(
            "selectedPanel"
        )
        .classList.remove(
            "active"
        );


    renderFurniture();

}



/* =========================
   写真
========================= */

function addPhotos(event) {

    const files =
        Array.from(
            event.target.files
        );


    files.forEach(
        file => {

        if(!file.type.startsWith(
            "image/"
        ))
            return;


        const reader =
            new FileReader();


        reader.onload =
            function(e) {

                photos.push({

                    id:
                        Date.now() +
                        Math.random(),

                    name:
                        file.name,

                    angle:
                        "正面",

                    image:
                        e.target.result

                });


                renderPhotos();

            };


        reader.readAsDataURL(
            file
        );

    });


    event.target.value = "";

}



/* =========================
   写真描画
========================= */

function renderPhotos() {

    const list =
        document.getElementById(
            "photoList"
        );


    list.innerHTML = "";


    photos.forEach(
        photo => {


        const card =
            document.createElement(
                "div"
            );


        card.className =
            "photo-card";


        card.innerHTML = `

            <img
                src="${photo.image}"
            >

            <div class="photo-info">

                <div class="photo-name">
                    ${photo.name}
                </div>

                <select
                    class="photo-angle"
                    onchange="
                        changePhotoAngle(
                            ${photo.id},
                            this.value
                        )
                    "
                >

                    <option
                        ${photo.angle === "正面" ? "selected" : ""}
                    >
                        正面
                    </option>

                    <option
                        ${photo.angle === "左側" ? "selected" : ""}
                    >
                        左側
                    </option>

                    <option
                        ${photo.angle === "右側" ? "selected" : ""}
                    >
                        右側
                    </option>

                    <option
                        ${photo.angle === "窓側" ? "selected" : ""}
                    >
                        窓側
                    </option>

                    <option
                        ${photo.angle === "入口側" ? "selected" : ""}
                    >
                        入口側
                    </option>

                    <option
                        ${photo.angle === "その他" ? "selected" : ""}
                    >
                        その他
                    </option>

                </select>

                <button
                    style="width:100%;margin-top:7px"
                    onclick="
                        deletePhoto(${photo.id})
                    "
                >
                    写真を削除
                </button>

            </div>

        `;


        list.appendChild(
            card
        );

    });

}



/* =========================
   写真角度変更
========================= */

function changePhotoAngle(
    id,
    angle
) {

    const photo =
        photos.find(
            item =>
                item.id === id
        );


    if(photo){

        photo.angle =
            angle;

    }

}



/* =========================
   写真削除
========================= */

function deletePhoto(id) {

    photos =
        photos.filter(
            photo =>
                photo.id !== id
        );


    renderPhotos();

}



/* =========================
   保存
========================= */

function saveLayout() {

    const data = {

        roomWidth:
            document.getElementById(
                "roomWidth"
            ).value,

        roomDepth:
            document.getElementById(
                "roomDepth"
            ).value,

        furniture:
            furnitureList,

        photos:
            photos

    };


    localStorage.setItem(
        "roomPlannerData",
        JSON.stringify(data)
    );


    alert(
        "部屋のレイアウトを保存しました。"
    );

}



/* =========================
   読み込み
========================= */

function loadLayout() {

    const saved =
        localStorage.getItem(
            "roomPlannerData"
        );


    if(!saved){

        alert(
            "保存データがありません。"
        );

        return;

    }


    const data =
        JSON.parse(saved);


    document.getElementById(
        "roomWidth"
    ).value =
        data.roomWidth;


    document.getElementById(
        "roomDepth"
    ).value =
        data.roomDepth;


    furnitureList =
        data.furniture || [];


    photos =
        data.photos || [];


    if(furnitureList.length){

        furnitureId =
            Math.max(
                ...furnitureList.map(
                    f => f.id
                )
            ) + 1;

    }


    selectedFurniture =
        null;


    document
        .getElementById(
            "selectedPanel"
        )
        .classList.remove(
            "active"
        );


    updateRoom();

    renderPhotos();


    alert(
        "レイアウトを読み込みました。"
    );

}



/* =========================
   全消去
========================= */

function clearLayout() {

    if(
        !confirm(
            "家具と写真をすべて削除しますか？"
        )
    )
        return;


    furnitureList = [];

    photos = [];

    selectedFurniture = null;

    furnitureId = 0;


    document
        .getElementById(
            "selectedPanel"
        )
        .classList.remove(
            "active"
        );


    renderFurniture();

    renderPhotos();

}



/* =========================
   起動
========================= */

updateRoom();
